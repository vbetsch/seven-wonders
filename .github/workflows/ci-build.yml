name: build

on:
  workflow_call:

jobs:
  tsc:
    name: Tsc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Env & Node
        uses: vbetsch/lib-github-actions/node-setup-project@v0.1
        with:
          node-version: '24.14.1'

      - name: Build application
        run: npm run build
